<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 水耕種植工作紀錄系統</title>
    <!-- 引入 Tailwind CSS 讓介面更美觀生動 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Font Awesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-green-100 transition-all hover:shadow-green-900/10">
        
        <!-- 標題與生動的動畫圖示 -->
        <div class="text-center mb-8">
            <div class="inline-block bg-green-100 text-green-600 p-4 rounded-full text-4xl mb-3 float-animation">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-wide">水耕工作紀錄</h1>
            <p class="text-sm text-green-600 font-medium mt-1">讓每一顆種子都有跡可循 💧</p>
        </div>

        <!-- 紀錄表單 -->
        <form id="recordForm" class="space-y-5">
            
            <!-- 1. 日期 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-regular fa-calendar-days text-green-500 mr-1"></i> 紀錄日期
                </label>
                <input type="date" id="date" required 
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition-all text-gray-700">
            </div>

            <!-- 2. 紀錄者姓名 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-regular fa-user text-green-500 mr-1"></i> 紀錄者姓名
                </label>
                <input type="text" id="name" placeholder="請輸入您的姓名" required
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition-all text-gray-700">
            </div>

            <!-- 3. 種植種類 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-solid fa-leaf text-green-500 mr-1"></i> 種植種類
                </label>
                <select id="plantType" required
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition-all text-gray-700 bg-white">
                    <option value="" disabled selected>-- 請選擇植物種類 --</option>
                    <option value="Romaine">🥬 Romaine (羅馬生菜)</option>
                    <option value="Spinach">🍃 Spinach (菠菜)</option>
                    <option value="Oak Leaf">🍁 Oak Leaf (橡木葉生菜)</option>
                    <option value="Rosso Leaf">🍂 Rosso Leaf (紅羅莎生菜)</option>
                    <option value="Lemon Basil">🌱 Lemon Basil (檸檬羅勒)</option>
                    <option value="Italian Basil">🌿 Italian Basil (義大利羅勒)</option>
                    <option value="Thai Basil">🪴 Thai Basil (泰式羅勒)</option>
                </select>
            </div>

            <!-- 4. 種植數量 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fa-solid fa-calculator text-green-500 mr-1"></i> 種植數量 (株/盆)
                </label>
                <input type="number" id="quantity" min="1" placeholder="請輸入正整數" required
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition-all text-gray-700">
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-green-500/20 transform active:scale-95 transition-all mt-4 cursor-pointer flex justify-center items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 即時上傳 Google Excel
            </button>
        </form>

        <!-- 提示訊息 -->
        <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium transition-all"></div>
    </div>

    <script>
        // 自動將今天日期設為預設值
        document.getElementById('date').valueAsDate = new Date();

        // 請替換成您在第二步取得的 Google Apps Script 網址
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4C61Ty2p1oXgppviUgsNQIh4pvBq4fofSqT2eCFJ2Pcaj9dEp3y2GjcqsJQLn6Sug/exec';

        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            // 按鈕讀取中狀態
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 資料傳送中...';
            
            // 收集表單資料
            const formData = {
                date: document.getElementById('date').value,
                name: document.getElementById('name').value,
                plantType: document.getElementById('plantType').value,
                quantity: document.getElementById('quantity').value
            };

            // 使用 Fetch API 異步傳送到 Google Sheets
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // 解決跨網域問題
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                // 顯示成功訊息
                statusMsg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-green-100 text-green-800 block";
                statusMsg.innerHTML = "🎉 紀錄成功！資料已即時同步至 Google Excel。";
                
                // 表單重置（保留日期與姓名方便連續輸入）
                document.getElementById('plantType').value = "";
                document.getElementById('quantity').value = "";
            })
            .catch(error => {
                statusMsg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-red-100 text-red-800 block";
                statusMsg.innerHTML = "❌ 傳送失敗，請檢查網路或設定。";
                console.error('Error:', error);
            })
            .finally(() => {
                // 恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 即時上傳 Google Excel';
            });
        });
    </script>
</body>
</html>
