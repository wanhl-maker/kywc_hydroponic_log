<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 水耕農場智慧紀錄後台</title>
    <style>
        :root {
            --primary-color: #2ec4b6;
            --secondary-color: #cbf3f0;
            --accent-color: #ff9f1c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            border-top: 8px solid var(--primary-color);
        }
        h2 {
            text-align: center;
            color: #2b2d42;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px var(--secondary-color);
        }
        .radio-group {
            display: flex;
            gap: 10px;
        }
        .radio-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .radio-group input { display: none; }
        .radio-group input:checked + .radio-btn {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 159, 28, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:hover { background-color: #e08913; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥬 水耕種植紀錄表</h2>
    <form id="hydroForm">
        <div class="form-group">
            <label>📅 紀錄日期</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>🧑‍🌾 紀錄者姓名</label>
            <input type="text" id="name" placeholder="請輸入你的名字" required>
        </div>

        <div class="form-group">
            <label>🔧 工作種類</label>
            <div class="radio-group">
                <label><input type="radio" name="jobType" value="播種" checked><div class="radio-btn">🌱 播種</div></label>
                <label><input type="radio" name="jobType" value="移植"><div class="radio-btn">🪵 移植</div></label>
                <label><input type="radio" name="jobType" value="收成"><div class="radio-btn">🎉 收成</div></label>
            </div>
        </div>

        <div class="form-group">
            <label>🥗 植物種類</label>
            <select id="plantType" required>
                <option value="Romaine">Romaine (蘿蔓)</option>
                <option value="Spinach">Spinach (菠菜)</option>
                <option value="Oak Leaf">Oak Leaf (橡木葉)</option>
                <option value="Rosso Leaf">Rosso Leaf (紅羅莎)</option>
                <option value="Lemon Basil">Lemon Basil (檸檬羅勒)</option>
                <option value="Italian Basil">Italian Basil (義大利羅勒)</option>
                <option value="Thai Basil">Thai Basil (九層塔/泰式羅勒)</option>
            </select>
        </div>

        <div class="form-group">
            <label>🔢 數量 (棵)</label>
            <input type="number" id="quantity" min="1" placeholder="請輸入數量" required>
        </div>

        <button type="submit">🚀 送出紀錄</button>
    </form>
</div>

<script>
    // 自動帶入今天日期
    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('hydroForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            date: document.getElementById('date').value,
            name: document.getElementById('name').value,
            jobType: document.querySelector('input[name="jobType"]:checked').value,
            plantType: document.getElementById('plantType').value,
            quantity: document.getElementById('quantity').value
        };

        // 這裡替換成你的 Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxXGvyawB31yk4iNJBoAYejxjwxBO_6kLkdxKgBMuWHwEvriqgGbmJtamQEtCiEhMjf/exec';

        alert('正在發送紀錄...');

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert('🎉 紀錄成功！資料已同步至 Excel。');
            document.getElementById('quantity').value = '';
        })
        .catch(error => alert('錯誤：', error));
    });
</script>
</body>
</html>
